[workspace]
members = ["spr-core"]
resolver = "2"

[package]
name = "spr"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Offline BIP39 seed phrase recovery for EVM, BTC, SOL, XRP, TRX, DOGE and ADA"
license = "MIT"

[[bin]]
name = "spr"
path = "src/main.rs"

[dependencies]
spr-core = { path = "spr-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
num_cpus = "1"
indicatif = "0.17"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
