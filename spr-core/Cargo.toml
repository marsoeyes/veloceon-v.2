[package]
name = "spr-core"
version = "1.0.0"
edition = "2021"

[dependencies]
bech32 = "0.12.0"
bip39 = { version = "3.0.0", features = ["all-languages"] }
blake2 = "0.11.0"
bs58 = "0.5.1"
curve25519-dalek = "5.0.0"
hex = "0.4.3"
hmac = "0.13.0"
num_cpus = "1.17.0"
rayon = "1.12.0"
ripemd = "0.2.0"
secp256k1 = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[dev-dependencies]
curve25519-dalek = "5.0.0"
hex = "0.4.3"
sha2 = "0.11.1"
